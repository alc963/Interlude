name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'deliverables/**'


env:
  JAVA_VERSION: "21"

jobs:
  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          cd frontend
          npm ci
          npm run lint
          
  frontend-test:
    needs: frontend-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          cd frontend
          npm ci
          npm run test

  frontend-build:
    needs: frontend-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          cd frontend
          npm ci
          npm run build

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: interlude
          POSTGRES_USER: interlude
          POSTGRES_PASSWORD: interlude
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 4
    env:
      POSTGRES_DB: interlude
      POSTGRES_USER: interlude
      POSTGRES_PASSWORD: interlude
      SECRET_KEY: cbef87d7c33a5d9f587cc5f79290e52b2c70fe84083f0329af8620816f6c9481
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "maven"
      - run: |
          cd backend
          chmod +x mvnw
          ./mvnw -B test

  backend-build:
    needs: backend-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "maven"
      - run: |
          cd backend
          chmod +x mvnw
          ./mvnw -B package -DskipTests